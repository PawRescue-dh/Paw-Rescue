name: PawRescue CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # --- BACKEND CI ---
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build

  # --- FRONTEND (FLUTTER) CI ---
  mobile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Verificar si existe la carpeta mobile
      - name: Check if mobile folder exists
        id: check
        run: |
          if [ -d "mobile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.exists == 'true'
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
      
      - run: flutter pub get
        if: steps.check.outputs.exists == 'true'
        working-directory: ./mobile
        
      - run: flutter analyze
        if: steps.check.outputs.exists == 'true'
        working-directory: ./mobile
        
      - run: flutter test
        if: steps.check.outputs.exists == 'true'
        working-directory: ./mobile

  # --- APK DE PRUEBAS (se descarga desde Actions > Artifacts) ---
  build-apk:
    needs: [backend-test, mobile-test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
      - run: flutter pub get
        working-directory: ./mobile
      - name: Build APK (release)
        working-directory: ./mobile
        run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'https://pawrescue-api.onrender.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: pawrescue-app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

